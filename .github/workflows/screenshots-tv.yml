name: Screenshots TV (emulador Android TV)

# Abre o app num emulador de Android TV (1080p) e tira capturas de tela reais navegando com o controle (DPAD).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaDebug

      - name: Create and start the emulator (Android TV 1080p)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          ls -l /dev/kvm || echo "::warning::no /dev/kvm"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "emulator" "system-images;android-34;android-tv;x86" > /dev/null
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n tv -k "system-images;android-34;android-tv;x86" -d tv_1080p --force
          echo "disk.dataPartition.size=3GB" >> "$ANDROID_AVD_HOME/tv.avd/config.ini"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -n 1
          emulator -list-avds
          nohup emulator -avd tv -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -no-snapshot -memory 3072 -accel on > emulator.log 2>&1 &
          echo $! > emu.pid
          for i in $(seq 1 60); do
            adb devices | grep -q "emulator-.*device" && break
            kill -0 "$(cat emu.pid)" 2>/dev/null || { echo "::error::Emulator process died"; tail -n 60 emulator.log; exit 1; }
            sleep 5
          done
          adb devices | grep -q "emulator-.*device" || { echo "::error::Emulator never appeared"; tail -n 60 emulator.log; exit 1; }
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "::error::Emulator did not boot"; tail -n 60 emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global hide_error_dialogs 1
          adb shell wm size; adb shell wm density
          sleep 90
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true

      - name: Install the app and take screenshots (D-pad)
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p shots
          shot() { adb exec-out screencap -p > "shots/$1.png"; }
          key() { adb shell input keyevent "$1"; sleep "${2:-3}"; }
          APK=$(ls smarttubetv/build/outputs/apk/stbeta/debug/*universal*.apk | head -n 1)
          adb install -r -g "$APK"
          adb shell am start -n org.smarthub.app/com.liskovsoft.smartyoutubetv2.tv.ui.main.SplashActivity
          sleep 60
          shot 01_abertura
          key KEYCODE_DPAD_LEFT 4
          shot 02_menu_aberto
          key KEYCODE_DPAD_RIGHT 4
          shot 03_conteudo
          key KEYCODE_DPAD_DOWN 3
          shot 04_segunda_prateleira
          for i in 1 2; do key KEYCODE_DPAD_RIGHT 1; done
          shot 05_foco
          adb shell wm size > shots/wm.txt
          adb shell dumpsys window displays | grep -E "mCurrentRotation|DisplayInfo" | head -n 3 >> shots/wm.txt || true
          adb logcat -d > shots/logcat.txt || true

      - name: Stop emulator
        if: always()
        run: kill "$(cat emu.pid)" 2>/dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telas-tv
          path: |
            shots/
            emulator.log
          if-no-files-found: warn
