name: Screenshots (emulador Android TV)

# Abre o app num emulador de Android TV e tira capturas de tela reais.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaDebug

      - name: Create and start the TV emulator
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "emulator" "system-images;android-34;android-tv;x86" > /dev/null
          echo no | avdmanager create avd -n tv -k "system-images;android-34;android-tv;x86" -d tv_1080p --force
          nohup emulator -avd tv -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 3072 > emulator.log 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 5; done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install the app and take screenshots
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p shots
          shot() { adb exec-out screencap -p > "shots/$1.png"; }
          key() { adb shell input keyevent "$1"; sleep "${2:-2}"; }

          APK=$(ls smarttubetv/build/outputs/apk/stbeta/debug/*universal*.apk | head -n 1)
          adb install -r -g "$APK"
          adb shell monkey -p org.smarthub.app -c android.intent.category.LEANBACK_LAUNCHER 1
          sleep 45
          shot 01_abertura

          key KEYCODE_DPAD_CENTER 6
          shot 02_tela_inicial

          key KEYCODE_DPAD_LEFT 3
          shot 03_menu_lateral

          for i in 1 2 3; do key KEYCODE_DPAD_DOWN 1; done
          shot 04_menu_descendo

          for i in $(seq 1 25); do key KEYCODE_DPAD_DOWN 1; done
          shot 05_menu_fim

          key KEYCODE_DPAD_CENTER 4
          shot 06_configuracoes

          key KEYCODE_DPAD_RIGHT 3
          shot 07_configuracoes_lista

          for i in $(seq 1 6); do key KEYCODE_DPAD_DOWN 1; done
          shot 08_configuracoes_fim

          key KEYCODE_DPAD_CENTER 4
          shot 09_item_aberto

          adb logcat -d > shots/logcat.txt || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telas-reais
          path: |
            shots/
            emulator.log
          if-no-files-found: warn
