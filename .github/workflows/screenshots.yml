name: Screenshots (emulador celular)

# Abre o app num emulador de celular (1080x2400) e tira capturas de tela reais.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaDebug

      - name: Create and start the emulator (phone)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          ls -l /dev/kvm || echo "::warning::no /dev/kvm"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n phone -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          # The runner is tight on disk: shrink the data partition and drop preinstalled toolchains we do not use
          echo "disk.dataPartition.size=3GB" >> "$ANDROID_AVD_HOME/phone.avd/config.ini"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -n 1
          avdmanager list avd
          emulator -list-avds
          ls -l "$ANDROID_AVD_HOME"
          nohup emulator -avd phone -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -no-snapshot -memory 3072 -accel on > emulator.log 2>&1 &
          echo $! > emu.pid
          # Wait for the device, but never forever
          for i in $(seq 1 60); do
            adb devices | grep -q "emulator-.*device" && break
            kill -0 "$(cat emu.pid)" 2>/dev/null || { echo "::error::Emulator process died"; tail -n 80 emulator.log; exit 1; }
            sleep 5
          done
          adb devices | grep -q "emulator-.*device" || { echo "::error::Emulator never appeared"; tail -n 80 emulator.log; exit 1; }
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "::error::Emulator did not boot"; tail -n 60 emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system accelerometer_rotation 1
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell wm size
          adb shell wm density

      - name: Install the app and take screenshots
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p shots
          shot() { adb exec-out screencap -p > "shots/$1.png"; }
          tap() { adb shell input tap "$1" "$2"; sleep "${3:-4}"; }

          APK=$(ls smarttubetv/build/outputs/apk/stbeta/debug/*universal*.apk | head -n 1)
          adb install -r -g "$APK"
          adb shell am start -n org.smarthub.app/com.liskovsoft.smartyoutubetv2.tv.ui.main.SplashActivity
          sleep 40
          shot 01_inicio

          # bottom bar: Buscar, Inicio, Shorts, Inscricoes, Historico, Config (6 equal tabs on 1080px)
          tap 450 2250 8;  shot 02_shorts
          tap 990 2250 6;  shot 03_configuracoes
          tap 810 2250 6;  shot 04_historico
          tap 270 2250 8;  shot 05_inicio_de_novo
          # open the first video card on Home, then come back
          tap 270 2250 8
          tap 540 1000 30; shot 06_video
          adb shell input keyevent KEYCODE_BACK; sleep 4
          tap 90 2250 5;   shot 07_busca
          adb shell input keyevent KEYCODE_BACK; sleep 3
          adb shell wm size > shots/wm.txt
          adb logcat -d > shots/logcat.txt || true

      - name: Stop emulator
        if: always()
        run: kill "$(cat emu.pid)" 2>/dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telas-reais
          path: |
            shots/
            emulator.log
          if-no-files-found: warn
