name: Release Smart Hub (signed APK + update manifest)

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog line shown in the in-app update dialog'
        default: 'Melhorias e correções'
      publish:
        description: 'Publish to the "latest" release (false = dry run: build, sign and verify only, nothing is published)'
        type: boolean
        default: true

permissions:
  contents: write

# Two releases at once would delete each other's assets while the manifest points at them
concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      CHANGELOG: ${{ inputs.changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # In-place updates only work if every release is signed with the SAME key.
      - name: Configure signing
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::Secret SIGNING_KEY is missing (base64 of your .jks)"; exit 1; }
          echo "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storeFile=$GITHUB_WORKSPACE/key.jks"
          } > keystore.properties

      - name: Build signed release
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaRelease

      - name: Create update manifest
        run: |
          VERSION=$(grep -m1 'versionName' smarttubetv/build.gradle | awk -F'"' '{print $2}')
          CODE=$(grep -m1 'versionCode' smarttubetv/build.gradle | awk '{print $2}')
          BASE="https://github.com/${{ github.repository }}/releases/download/latest"
          D=smarttubetv/build/outputs/apk/stbeta/release
          python3 - "$VERSION" "$CODE" "$BASE" "$D" <<'PY'
          import json,os,sys
          ver,code,base,d=sys.argv[1:5]
          apk=lambda abi: f"{base}/SmartHub_beta_{ver}_{abi}.apk"
          m={"package":{
              "downloadUrl":apk("universal"),
              "downloadUrlList_arm64-v8a":[apk("arm64-v8a")],
              "downloadUrlList_armeabi-v7a":[apk("armeabi-v7a")]},
             ver:{"versionCode":int(code),"changelog":[os.environ["CHANGELOG"]]}}
          json.dump(m,open(f"{d}/smarthub.json","w"),indent=2)
          PY
          ls "$D"

      # Fail before publishing anything if the APKs are not signed with the release key
      # (a debug-signed APK would never update over a release install, and the other way around).
      - name: Verify signatures and manifest
        shell: bash # adds pipefail: the default 'bash -e' ignores a failing command in front of a pipe
        run: |
          D=smarttubetv/build/outputs/apk/stbeta/release
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          CODE=$(grep -m1 'versionCode' smarttubetv/build.gradle | awk '{print $2}')
          for f in "$D"/SmartHub_beta_*.apk; do
            echo "== $f"
            "$AS" verify --print-certs "$f" > /tmp/cert.txt || { cat /tmp/cert.txt; echo "::error::$f does not verify"; exit 1; }
            cat /tmp/cert.txt
            grep -qi "Android Debug" /tmp/cert.txt && { echo "::error::$f is signed with the debug key"; exit 1; }
          done
          grep -q "\"versionCode\": $CODE" "$D/smarthub.json" || { echo "::error::smarthub.json does not carry versionCode $CODE"; exit 1; }
          for abi in universal arm64-v8a armeabi-v7a; do
            [ -f "$D/SmartHub_beta_$(grep -m1 'versionName' smarttubetv/build.gradle | awk -F'"' '{print $2}')_$abi.apk" ] || { echo "::error::missing APK for $abi"; exit 1; }
          done
          # Same key as the published build (else every installed copy refuses the update), and a newer versionCode
          VER=$(grep -m1 'versionName' smarttubetv/build.gradle | awk -F'"' '{print $2}')
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"
          if curl -fsL -o /tmp/published.apk "$BASE/SmartHub_beta_${VER}_universal.apk"; then
            "$AS" verify --print-certs /tmp/published.apk > /tmp/old_cert.txt || true
            "$AS" verify --print-certs "$D/SmartHub_beta_${VER}_universal.apk" > /tmp/new_cert.txt
            OLD=$(grep -m1 'certificate SHA-256 digest' /tmp/old_cert.txt || true)
            NEW=$(grep -m1 'certificate SHA-256 digest' /tmp/new_cert.txt || true)
            [ -n "$NEW" ] && [ "$OLD" = "$NEW" ] || { echo "::error::signing key differs from the published build ($OLD vs $NEW)"; exit 1; }
          fi
          curl -fsL -o /tmp/published.json "$BASE/smarthub.json" || true
          PUBLISHED=$(grep -m1 '"versionCode"' /tmp/published.json 2>/dev/null | tr -dc '0-9' || true)
          if [ -n "$PUBLISHED" ] && [ "$CODE" -le "$PUBLISHED" ]; then
            echo "::error::versionCode $CODE is not newer than the published $PUBLISHED (users would never get this build)"; exit 1
          fi
          echo "OK: signed with the release key, manifest matches versionCode $CODE"

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-hub-release
          path: |
            smarttubetv/build/outputs/apk/stbeta/release/*.apk
            smarttubetv/build/outputs/apk/stbeta/release/smarthub.json

      - name: Publish release "latest"
        if: ${{ inputs.publish }}
        run: |
          D=smarttubetv/build/outputs/apk/stbeta/release
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Smart Hub (latest)" --notes "Automatic update channel"
          gh release upload latest "$D"/*.apk "$D"/smarthub.json --clobber
          # Drop stale assets from older releases (e.g. the former SmartTube_* names)
          NEW=$(ls "$D"/*.apk "$D"/smarthub.json | xargs -n1 basename)
          gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
            echo "$NEW" | grep -qx "$name" || gh release delete-asset latest "$name" -y
          done
